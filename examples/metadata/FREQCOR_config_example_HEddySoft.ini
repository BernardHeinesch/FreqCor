[IO]
#1 = Read routine selection.
#    FREQCOR_Read_EP (standard EddyPro run) or
#    FREQCOR_Read_GEddySoft (GEddySoft HDF5, IRGA or TRACER/TOF; see #2-3) or
#    FREQCOR_Read_HEddySoft.
read_routine = FREQCOR_Read_HEddySoft
#2 = GEddySoft source selection (FREQCOR_Read_GEddySoft only).
#     irga: reads the IRGA group; channel selected by name/gss.
#     tof : reads the TRACER group (PTR-TOF-MS); channel selected by target_mz.
source_type = irga
#3 = Target mz for TRACER channel selection (required when source_type = tof,
#     tolerance 0.01; ignored when source_type = irga).
#     Typical values: 33.033 (methanol), 45.033, 69.0699 (isoprene), 137.132 (monoterpenes)
target_mz = 
# Paths below must be either absolute, or relative to the project root folder (the main repository folder).
#4 = Full glob pattern (path + wildcard + extension) to the binned cospectra files.
#    CSV files (*binned_cospectra*_adv.csv) for FREQCOR_Read_EP;
#    GEddySoft HDF5 files (*.hdf5) for FREQCOR_Read_GEddySoft;
#    HEddySoft pickle file (.pkl) for FREQCOR_Read_HEddySoft.
binned_cosp = ../HEddySoft/examples/FR-Hes/output/FR-Hes_output_20220701000000-20220710000000-spectral.pkl
#5 = Full glob pattern (path + wildcard + extension) to the CSV file containing flux, meteo and QC data.
#     Required only when read_routine = FREQCOR_Read_EP (EddyPro full_output file).
#     Not used by FREQCOR_Read_GEddySoft or FREQCOR_Read_HEddySoft
#     (fluxes are read from the GEddySoft HDF5 files or the HEddySoft pickle file).
flx_meteo = 
#6 = Path to output folder
output_path = examples/output
#7 = Full glob pattern (path + wildcard + extension) to an alternative RH CSV.
#    Only used when rh_from_file = 1 in [PROCEDURE_OPTIONS]. Must contain columns: TIMESTAMP_END, RH.
#    See ICOSETC_BE-Lon_METEO_L2.csv in examples/data for the expected format.
rh_path = 
#8 = Full glob pattern (path + wildcard + extension) to the ICOS-ETC global flux flag CSV (Vitale et al. 2020).
#    Only used when vitale_qc_flags = 1 in [PROCEDURE_OPTIONS].
#    See ICOSETC_BE-Lon_FLUXES_L2.csv in examples/data for the expected format.
vitale_path = 
#9 = Path (full, including file name) to file containing Massman coefficients of modeled local cospectra.
#    Optional. When available, used only for plotting of the reference Massman cospectra.
#    See Massman_coef.csv in examples/data for the expected format.
massman_path = examples/data/EddyPro/Massman_coef.csv
#10 = Base name used only for intermediate outputs/cache (i.e. if [PROCESSED_DATA], #1 =1) 
#    and not for the main run_tag-named outputs
output_file = BE-Lon_LI7200_HEddySoft_cosp_20240501-20240630

[TIME_WINDOW]
# Enable time window filtering (0: disabled, 1: enabled)
enable_time_window = 1
# Start date and time in format YYYY-MM-DD HH:MM
start_datetime = 2024-05-01 00:00
#start_datetime = 2024-06-01 00:00
# End date and time in format YYYY-MM-DD HH:MM
end_datetime = 2024-06-30 23:30
#4 = Enable exclusion of sub-periods within the processing window (0: disabled, 1: enabled)
enable_exclusion_windows = 0
#5 = Start date(s) of exclusion window(s). Format: YYYY-MM-DD HH:MM. Multiple windows: comma-separated (e.g. 2022-06-05 00:00, 2022-06-20 12:00)
date_exclusion_start = 2024-05-03 00:00
#6 = End date(s) of exclusion window(s). Format: YYYY-MM-DD HH:MM. Must match the number of entries in date_exclusion_start
date_exclusion_end = 2024-05-06 00:00

[PROCEDURE_OPTIONS]
#1 = Strategy for cut-off frequency computation : Cospectra = 1, Spectra = 2
sps = 1
#2 = Gas analysed. CO2 = 1; H2O = 2; O3 = 3; CH4 = 4; N2O = 5
#     Unused when source_type = tof (species selected by target_mz; non-H2O branch forced).
gss = 1
#3 = Number of classes for cut-off frequency look-up tables first sorting 
#    level. The first sorting variable is wind direction (wd) for non-h2o gases 
#    and relative humidity (rh) for h2o. Used both for cof and CF computation. 
#    If set to 1, the number of classes for the second sorting level is considered.
#    Suggested classnumwd=1 if you do not expect wind direction effects.
#    Suggested classnumrh=8 because strong rh impact on h2o cof and CF is always present.
classnumwd = 1
classnumrh = 8
#4 = Number of classes for cut-off frequency look-up tables second sorting 
#    level (wind speed). This user input is considered only if number of classes for the first level of sorting for the 
#    selected gas is set to 1 (#3); otherwise, this value is hard-coded to 4.
classnumcofws = 5
#5 = Number of wind-speed classes for the correction factor look-up tables 
#    second sorting level (wind speed). Two separate LUTs are built: classnumcf_u for the 
#    unstable subset (z/L < 0) and classnumcf_s for the stable subset (z/L > 0).
#    This user input is considered only if the number of classes at #3 is set 
#    to 1; otherwise these values are hard-coded to 4.
classnumcf_u = 5
classnumcf_s = 5
#6 = Horst and Lenschow (2009) equation to use in sensor separation correction factor computation.
#    Only considered for spectral approach (#1 = 2)
#    Can be either 13 or 16 (16 is recommended).
eq = 16
#7 = Anemometer losses for path averaging and time response. Activated = 1; Inactivated = 0.
#	 Applies the theoretical correction on reference cospectra before computing the correction factors (recommended).
tf_sonic = 1
#8 = Transfer function fit according to Peltola et al. 2021 (square-root of H). 
#    Only considered for cospectral approach (#1 = 1), spectral approach always applying the square-root.
#    Activated = 1; Inactivated = 0.
#    Should be 1 if timelag search through covariance maximisation was used before (co-)spectra computation.
#    Note: applies to the Lorentz fit form only (Gaussian TF is unchanged). 
#    Note : Peltola uses TF = sqrt(Lorentz). Therefore cof corresponds to the half-power point (TF² = 0.5), not the half-amplitude point of TF.
tf_peltola = 1
#9 = Option to use the ICOS-ETC global data flux flag computed according to Vitale et al. 2020. 
#     When activated (= 1), the flags stored in the dedicated csv file accessible at "vitale_path" 
#	  is used instead of the VM and F flags defined above.
vitale_qc_flags = 0
#10 = Option to read air relative humidity (RH) from an alternative CSV file (IO.rh_path) instead of flx_meteo.
#     Useful because with Eddypro runs without external RH, RH is computed from Tsonic and might be biased.
#     When activated (= 1), the RH values are taken from rh_path and aligned using TIMESTAMP_END.
rh_from_file = 0

[EC_SETUP]
#1 = Site name
jsite = BE-Lon
# The below parameters (2-6) are needed only for the spectral approach (#1 of [PROCEDURE_OPTIONS]= 2) because needed in the HL sensor separation formulas.
# They are useless/ignored when applying the co-spectral approach 
#2 = Measurement height (m). It is only used when [PROCEDURE_OPTIONS] #1 = 2 
#    (procedure : Spectra), for the sensor separation term.
zmeas = 2.7
#3 = Displacement height (m). It is only used when [PROCEDURE_OPTIONS] #1 = 2 
#    (procedure : Spectra), for the sensor separation term.
disph = 0.1
#4 = Vertical sensor separation (m). It is only used when [PROCEDURE_OPTIONS] #1 = 2 
#    (procedure : Spectra), for the sensor separation term.
rsz = -0.25
#5 = Eastward sensor separation (m). It is only used when [PROCEDURE_OPTIONS] #1 = 2 
#    (procedure : Spectra), for the sensor separation term.
rseast = 0.
#6 = Northward sensor separation (m). It is only used when [PROCEDURE_OPTIONS] #1 = 2 
#    (procedure : Spectra), for the sensor separation term.
rsnorth = 0.

[USER_LIMITS]
#1 = Wind sector exclusion range ( from north). Data included in this range 
#    will be discarded from the correction procedure.
wdmin = 0
wdmax = 0
#2 = Limits for (co)spectra selection for cof computation. hl : sensible heat [Wm-2]; 
#    fc : main tracer [umolm-2s-1]; le : latent heat [Wm-2]. The flux and limits are used in absolute values.
hl_cof_min = 50
hl_cof_max = 1000
fcl_cof_min = 5
fcl_cof_max = 100
lel_cof_min = 30
lel_cof_max = 1000
#3 = (co)spectral absolute limit. If a single point of a half-hourly normalized (co)spectrum exceeds 
#     this threshold in absolute value, the whole half-hour is discarded for the cof computation. 
#     Unit: normalized (co)spectrum (-). 250 is usually a good choice.
cospec_abs_limit = 250
#4 = Limits for cospectra selection for CF computation, unstable conditions.
#    On sensible heat only [Wm-2]. Only fluxes greater than this threshold are kept.
hl_cf_u_min = 30
#5 = Limits for cospectra selection for CF computation, stable conditions.
#    On sensible heat only [Wm-2]. Only fluxes smaller than this threshold are kept.
hl_cf_s_max = 0
#6 = Additional absolute cap on sensible heat flux used for CF selection [Wm-2].
#     Applied in both unstable and stable conditions.
hl_cf_abs_max = 1000
#7 = Quality flags for Vickers and Mahrt (VM) tests. The VM tests used, when available, 
#    are: spikes, drop-out, skewness hard, discontinuities hard. 
#    0: limit value. If > 0, at least a test failed, and the data is discarded.
fvm = 0
#8 = Quality flags for Foken (F) tests (stationarity and ITC combined): 0 if both < 30%, 
#    1 if any is 30-100%, 2 if any > 100%. If value larger than the threshold, the data is discarded.
ff = 0
#9 = Frequency range for transfer function (TF) quality check [Hz]. The coefficient 
#    of variation of the experimental TF is checked in this range and compared to #9 (varclim).
jtmin = 0.021
jtmax = 0.34
#10 = Limit for the coefficient of variation (std dev/mean) of the TF quality check 
#     range. If it is > varclim, the TF is discarded.
varclim = 1
#11 = Frequency range for TF fitting [Hz]
tfmin = 0.021
tfmax = 10

[PROCESSED_DATA]
#1 = Save Read routine output data to files for later use (0: disabled, 1: enabled)
enable_saving = 0
#2 = Inclusion of timestamp in saved intermediate file names (0: use site name only, 1: include timestamp). Applies only if 
use_timestamp = 1
#3 = Load previously saved data to speed up reading time (0: disabled, 1: enabled)
enable_loading = 0
#4 = Prefix for the saved files ("site-name" or "site-name_timestamp")
file_prefix = BE-Lon

[PLOTS]
#1 = Plot options (0 = disabled, 1 = enabled)
#     plot_hh   : plot individual half-hour (co)spectra (very verbose)
#     plot_main : main results plots (averaged/unified (co)spectra, transfer functions, CF vs WS)
#     plot_aux  : auxiliary/diagnostic plots (all individual, filtering steps, additional diagnostics)
#     plot_save : save figures to output_path (1) or display interactively (0)
plot_hh = 0
plot_main = 1
plot_aux = 1
plot_save = 1
